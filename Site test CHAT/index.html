<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique en Ligne</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Boutique en Ligne</h1>
        <nav>
            <ul>
                <li><a href="#home">Accueil</a></li>
                <li><a href="#products">Produits</a></li>
                <li><a href="#cart">Panier</a></li>
            </ul>
        </nav>
    </header>

    <section id="home">
        <h2>Bienvenue dans notre boutique</h2>
        <p>Découvrez nos produits les plus populaires !</p>
    </section>

    <section id="products">
        <h2>Nos Produits</h2>
        <div class="product-list">
            <div class="product" data-id="1">
                <h3>Produit 1</h3>
                <p>Prix: 20€</p>
                <button onclick="addToCart(1)">Ajouter au panier</button>
            </div>
            <div class="product" data-id="2">
                <h3>Produit 2</h3>
                <p>Prix: 30€</p>
                <button onclick="addToCart(2)">Ajouter au panier</button>
            </div>
            <div class="product" data-id="3">
                <h3>Produit 3</h3>
                <p>Prix: 40€</p>
                <button onclick="addToCart(3)">Ajouter au panier</button>
            </div>
        </div>
    </section>

    <section id="cart">
        <h2>Panier</h2>
        <ul id="cart-items"></ul>
        <p>Total: <span id="total-price">0</span> €</p>
        <button onclick="checkout()">Valider la commande</button>
    </section>

    <script src="script.js"></script>
</body>
</html>
